[tool.poetry]
name = "solana-trader"
version = "0.1.0"
description = "AI-powered Solana meme token trading agent"
authors = ["trader"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Solana
solders = "^0.21.0"
solana = "^0.35.0"

# AI
anthropic = "^0.40.0"

# HTTP / WebSocket
httpx = "^0.27.0"
websockets = ">=9.0,<12.0"

# Twitter
tweepy = "^4.14.0"

# Database
sqlmodel = "^0.0.21"
aiosqlite = "^0.20.0"

# Utils
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
structlog = "^24.4.0"
python-dotenv = "^1.0.1"
base58 = "^2.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
